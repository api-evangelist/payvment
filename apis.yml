  experiences for Facebook Pages, letting merchants sell directly inside the social network. The company is
  no longer operating independently: its assets moved to Ecwid, and the payvment.com domain now
  301-redirects to www.ecwid.com. No live Payvment developer portal, API documentation, OpenAPI definition,
  SDK, or other machine-readable API surface could be found during enrichment. This record is retained as a
  historical portfolio-company profile in the API Evangelist network with no active API surface to score.
